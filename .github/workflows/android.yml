name: Android CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonovel-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
